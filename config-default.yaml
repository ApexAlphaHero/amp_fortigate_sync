# Credentials are NOT stored here — put them in /etc/amp-fw-sync/secrets.env:
#
#   AMP_USERNAME=your-amp-username
#   AMP_PASSWORD=your-amp-password
#   FORTIGATE_API_TOKEN=your-fortigate-token

docker:
  socket: "unix:///var/run/docker.sock"
  label_filter: ""  # e.g. "amp-sync=true" — leave blank to watch all containers

amp:
  # Use the server's LAN IP — AMP blocks API auth from 127.0.0.1/localhost
  host: "http://192.168.1.100:8080"

fortigate:
  host: "https://192.168.1.1"   # FortiGate management IP/hostname
  ext_ip: ""                     # Public/WAN IP used as the VIP external address
  ssl_verify: true
  ssl_ssh_profile: "Games"       # SSL/SSH inspection profile applied to created policies (set to null or remove to disable)
  policy_insert_after: null      # Policy ID to insert new rules after (null = system default position)
  service_category: "Games"     # Category assigned to created service objects (null to leave uncategorized)

# host_ip: auto-detected from the default network route (outbound LAN IP).
# Override here only if auto-detection picks the wrong interface.
# host_ip: "192.168.1.100"

poll_interval_seconds: 300
log_level: "INFO"

state_db_path: "/var/lib/amp-fw-sync/state.db"
