# Credentials are NOT stored here — put them in /etc/amp-fw-sync/secrets.env:
#
#   AMP_USERNAME=your-amp-username
#   AMP_PASSWORD=your-amp-password
#   FORTIGATE_API_TOKEN=your-fortigate-token

docker:
  socket: "unix:///var/run/docker.sock"
  label_filter: ""  # e.g. "amp-sync=true" — leave blank to watch all containers

amp:
  host: "http://localhost:8080"  # AMP web UI base URL

fortigate:
  host: "https://192.168.1.1"        # FortiGate management IP/hostname
  ext_ip: ""                          # Public IP address used as the VIP external IP
  ssl_verify: true

# Local IP of this server — used as the mapped (internal) IP in VIPs.
# Leave blank to auto-detect from the default network route.
host_ip: ""

poll_interval_seconds: 30
log_level: "INFO"

state_db_path: "/var/lib/amp-fw-sync/state.db"
